<svg xmlns="http://www.w3.org/2000/svg" width="760" height="426" viewBox="0 0 760 426" role="img">
<title>Qwen3-8B decode throughput on AWS Trainium2</title>
<desc>Baseline and DFlash causal and bidirectional query-block mask throughput.</desc>
<rect width="760" height="426" fill="white"/>
<text x="380.0" y="27" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">Qwen3-8B decode throughput on AWS Trainium2</text>
<text x="380.0" y="49" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">six requests per configuration; one request at a time; 128 completion tokens each</text>
<text x="200" y="93" text-anchor="end" font-family="sans-serif" font-size="13">baseline</text>
<rect x="210" y="77" width="214.4" height="23" rx="2" fill="#64748b"/>
<text x="432.4" y="93" font-family="sans-serif" font-size="13" font-weight="700">51.7 tok/s</text>
<text x="200" y="132" text-anchor="end" font-family="sans-serif" font-size="13">k=2 causal</text>
<rect x="210" y="116" width="268.3" height="23" rx="2" fill="#ea580c"/>
<text x="486.3" y="132" font-family="sans-serif" font-size="13" font-weight="700">64.7 tok/s</text>
<text x="200" y="171" text-anchor="end" font-family="sans-serif" font-size="13">k=2 bidirectional</text>
<rect x="210" y="155" width="306.0" height="23" rx="2" fill="#2563eb"/>
<text x="524.0" y="171" font-family="sans-serif" font-size="13" font-weight="700">73.8 tok/s</text>
<text x="200" y="210" text-anchor="end" font-family="sans-serif" font-size="13">k=4 causal</text>
<rect x="210" y="194" width="287.3" height="23" rx="2" fill="#ea580c"/>
<text x="505.3" y="210" font-family="sans-serif" font-size="13" font-weight="700">69.3 tok/s</text>
<text x="200" y="249" text-anchor="end" font-family="sans-serif" font-size="13">k=4 bidirectional</text>
<rect x="210" y="233" width="365.3" height="23" rx="2" fill="#2563eb"/>
<text x="583.3" y="249" font-family="sans-serif" font-size="13" font-weight="700">88.1 tok/s</text>
<text x="200" y="288" text-anchor="end" font-family="sans-serif" font-size="13">k=8 causal</text>
<rect x="210" y="272" width="286.1" height="23" rx="2" fill="#ea580c"/>
<text x="504.1" y="288" font-family="sans-serif" font-size="13" font-weight="700">69.0 tok/s</text>
<text x="200" y="327" text-anchor="end" font-family="sans-serif" font-size="13">k=8 bidirectional</text>
<rect x="210" y="311" width="370.7" height="23" rx="2" fill="#2563eb"/>
<text x="588.7" y="327" font-family="sans-serif" font-size="13" font-weight="700">89.4 tok/s</text>
<text x="200" y="366" text-anchor="end" font-family="sans-serif" font-size="13">k=15 causal</text>
<rect x="210" y="350" width="279.1" height="23" rx="2" fill="#ea580c"/>
<text x="497.1" y="366" font-family="sans-serif" font-size="13" font-weight="700">67.3 tok/s</text>
</svg>
